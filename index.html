<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock ChildCare Ministries Uganda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --orange: #ff6b00;
      --orange-dark: #df5700;
      --orange-light: #fff4eb;
      --dark: #171717;
      --gray: #666;
      --white: #fff;
      --light: #f8fafc;
      --border: #e8e8e8;
      --green: #159447;
      --header-height: 80px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      scroll-behavior: smooth;
    }
    body {
      background: #fff;
      color: var(--dark);
      line-height: 1.6;
      overflow-x: hidden;
      padding-top: var(--header-height);
    }
    /* ================= FIXED HEADER ================= */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      box-shadow: 0 3px 20px rgba(0,0,0,.08);
      padding: 0 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .brand h2 {
      font-size: 1.05rem;
      line-height: 1.2;
      font-weight: 800;
    }
    .brand span {
      display: block;
      color: var(--orange);
      font-size: .72rem;
      font-weight: 600;
    }
    .nav-container {
      display: flex;
      align-items: center;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      list-style: none;
    }
    .nav a {
      color: var(--dark);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: .25s;
    }
    .nav a:hover,
    .nav a.active {
      color: var(--orange);
    }
    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--dark);
      cursor: pointer;
    }
    /* ================= BUTTONS ================= */
    .btn {
      border: none;
      border-radius: 50px;
      padding: 12px 23px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: .3s;
    }
    .btn-primary {
      background: var(--orange);
      color: white;
      box-shadow: 0 7px 20px rgba(255,107,0,.25);
    }
    .btn-primary:hover {
      background: var(--orange-dark);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255,107,0,.35);
    }
    .btn-outline {
      background: white;
      color: var(--orange);
      border: 2px solid var(--orange);
    }
    .btn-outline:hover {
      background: var(--orange);
      color: white;
    }
    .btn-large {
      padding: 15px 32px;
      font-size: 1rem;
    }

    /* Floating Impact Button */
    .impact-float-btn {
      position: fixed;
      bottom: 25px;
      left: 25px;
      z-index: 2500;
      background: var(--orange);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 50px;
      padding: 12px 22px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 10px 30px rgba(255, 107, 0, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .impact-float-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 14px 35px rgba(255, 107, 0, 0.5);
      background: var(--orange-dark);
    }
    @media (max-width: 600px) {
      .impact-float-btn {
        bottom: 18px;
        left: 15px;
        padding: 10px 18px;
        font-size: 0.85rem;
      }
    }

    /* ================= NEWSPAPER IMPACT PAGE ================= */
    .newspaper-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 55px 5% 80px;
    }

    .news-masthead {
      text-align: center;
      border-bottom: 4px double var(--dark);
      border-top: 4px double var(--dark);
      padding: 18px 0;
      margin-bottom: 30px;
    }
    .news-masthead h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dark);
      margin: 0;
      line-height: 1;
    }
    .news-masthead .news-kicker {
      font-size: .8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--orange);
      font-weight: 700;
      margin-top: 8px;
    }

    .news-article-headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2rem, 5.5vw, 3.4rem);
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
      color: var(--dark);
      margin: 20px 0 12px;
    }

    .news-standfirst {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.15rem;
      font-style: italic;
      text-align: center;
      color: #555;
      max-width: 720px;
      margin: 0 auto 25px;
      line-height: 1.5;
    }

    .news-meta {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gray);
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
      font-weight: 600;
    }
    .news-meta span strong { color: var(--dark); }

    .news-hero-img {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .news-caption {
      font-size: .82rem;
      color: var(--gray);
      font-style: italic;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .news-body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.08rem;
      line-height: 1.75;
      color: #222;
      columns: 2;
      column-gap: 45px;
      text-align: justify;
    }
    .news-body p {
      margin-bottom: 1.1em;
    }
    .news-body p:first-of-type::first-letter {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 4.2rem;
      font-weight: 900;
      float: left;
      line-height: .85;
      padding: 8px 12px 0 0;
      color: var(--orange);
    }
    .news-body h3 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--dark);
      margin: 28px 0 12px;
      line-height: 1.2;
      column-span: all;
      border-left: 5px solid var(--orange);
      padding-left: 14px;
    }
    .news-body .news-pull-quote {
      column-span: all;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.6rem;
      font-style: italic;
      font-weight: 700;
      line-height: 1.4;
      color: var(--orange);
      text-align: center;
      padding: 25px 40px;
      margin: 30px 0;
      border-top: 2px solid var(--orange);
      border-bottom: 2px solid var(--orange);
      background: var(--orange-light);
      border-radius: 4px;
    }
    .news-body .news-inline-img {
      break-inside: avoid;
      width: 100%;
      margin: 20px 0;
      border-radius: 6px;
    }
    .news-body .news-inline-img img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }
    .news-body .news-inline-img figcaption {
      font-size: .8rem;
      color: var(--gray);
      font-style: italic;
      margin-top: 8px;
      text-align: center;
      line-height: 1.4;
    }

    .news-cta {
      column-span: all;
      background: linear-gradient(135deg, var(--orange-light), #fff);
      border: 2px solid var(--orange);
      border-radius: 16px;
      padding: 35px 30px;
      text-align: center;
      margin-top: 40px;
    }
    .news-cta p {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.2rem;
      font-style: italic;
      color: #5a3410;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .news-stats-row {
      column-span: all;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 30px 0;
    }
    .news-stat {
      background: var(--light);
      border: 1px solid var(--border);
      border-top: 4px solid var(--orange);
      border-radius: 10px;
      padding: 20px 15px;
      text-align: center;
    }
    .news-stat strong {
      display: block;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--orange);
      line-height: 1;
    }
    .news-stat span {
      font-size: .8rem;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .news-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      background: none;
      border: none;
      color: var(--orange);
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
      padding: 8px 0;
      transition: .25s;
    }
    .news-back-btn:hover {
      gap: 12px;
    }

    @media (max-width: 800px) {
      .news-body { columns: 1; }
      .news-stats-row { grid-template-columns: 1fr; }
      .news-body h3 { column-span: none; }
      .news-body .news-pull-quote { column-span: none; padding: 20px; font-size: 1.3rem; }
      .news-cta { column-span: none; }
      .news-stats-row { column-span: none; }
    }

    /* Impact Story Modal Layout (legacy - kept for safety) */
    .impact-modal-box {
      max-width: 750px !important;
      padding: 35px 30px !important;
    }
    .impact-story-block {
      margin-bottom: 35px;
      background: var(--light);
      padding: 24px;
      border-radius: 18px;
      border-top: 4px solid var(--orange);
      text-align: center;
    }
    .impact-story-block h4 {
      color: var(--orange);
      font-size: 1.3rem;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .impact-story-block img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 14px;
      margin: 0 auto 16px;
      display: block;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    .impact-story-block p {
      font-size: 0.95rem;
      color: #444;
      line-height: 1.6;
      text-align: left;
    }

    /* ================= SECTIONS ================= */
    .page-section {
      display: none;
      max-width: 1250px;
      margin: auto;
      padding: 55px 5%;
    }
    .page-section.active-section {
      display: block;
      animation: fadeIn .45s ease;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .section-heading {
      text-align: center;
      margin-bottom: 35px;
    }
    .section-heading h2 {
      font-size: 2.4rem;
      color: var(--orange);
      margin-bottom: 8px;
    }
    .section-heading p {
      color: var(--gray);
    }
    /* ================= HERO ================= */
    .hero {
      min-height: 620px;
      border-radius: 25px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      background: #1b1b1b;
      color: white;
      padding: 70px;
    }
    .hero-slides { position: absolute; inset: 0; z-index: 0; }
    .hero-slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0;
      transform: scale(1);
      transition: opacity 1.8s ease-in-out, transform 7s ease-out;
    }
    .hero-slide.on { opacity: 1; transform: scale(1.06); }
    .hero::before {
      content: ""; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.25));
    }
    .hero-dots {
      position: absolute; right: 28px; bottom: 66px; z-index: 3;
      display: flex; gap: 8px;
    }
    .hero-dots span {
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(255,255,255,.45); transition: .4s;
    }
    .hero-dots span.on { background: var(--orange); width: 26px; border-radius: 6px; }
    .hero-content {
      max-width: 680px;
      position: relative;
      z-index: 2;
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-slide { transition: opacity 1.8s ease-in-out; transform: none !important; }
    }
    .hero-tag {
      display: inline-block;
      background: rgba(255,107,0,.95);
      padding: 8px 17px;
      border-radius: 50px;
      font-size: .85rem;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1.05;
      margin-bottom: 20px;
      font-weight: 800;
    }
    .hero h1 span {
      color: #ff8a35;
    }
    .hero p {
      font-size: 1.1rem;
      color: #f3f3f3;
      margin-bottom: 28px;
      max-width: 620px;
    }
    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
    }
    /* ================= QUICK STATS ================= */
    .stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 15px;
      margin: -45px 5% 50px;
      position: relative;
      z-index: 5;
    }
    .stat {
      background: white;
      padding: 25px 15px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.1);
      cursor: pointer;
      transition: transform .3s, box-shadow .3s;
      position: relative;
    }
    .stat i {
      color: var(--orange);
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .stat h3 {
      font-size: 1.7rem;
      color: var(--dark);
    }
    .stat p {
      color: var(--gray);
      font-size: .85rem;
    }
    .stat:hover, .stat:focus-visible {
      transform: translateY(-6px);
      box-shadow: 0 14px 36px rgba(255,107,0,.22);
      outline: none;
    }
    .stat .stat-more {
      display: block; margin-top: 8px;
      font-size: .72rem; font-weight: 700; color: var(--orange);
      opacity: .85;
    }
    .stat:hover .stat-more { opacity: 1; }

    /* ================= PROGRAM POPUP ================= */
    .pm-card {
      max-width: 860px !important;
      padding: 0 !important;
      overflow-x: hidden;
    }
    .pm-card .modal-close {
      z-index: 20; top: 12px; right: 14px;
      width: 40px; height: 40px; line-height: 38px; text-align: center;
      background: rgba(255,255,255,.92); border-radius: 50%;
      font-size: 1.6rem; color: #333; box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }
    .pm-slider {
      position: relative; height: 340px; background: #111; overflow: hidden;
    }
    .pm-slide {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; background: #000; opacity: 0; transition: opacity 1s ease-in-out;
    }
    .pm-slide.on { opacity: 1; }
    .pm-slider::after {
      content: ""; position: absolute; inset: auto 0 0 0; height: 90px;
      background: linear-gradient(transparent, rgba(0,0,0,.45)); pointer-events: none;
    }
    .pm-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: rgba(255,255,255,.88); color: var(--dark);
      cursor: pointer; font-size: 1rem; transition: .25s;
    }
    .pm-arrow:hover { background: var(--orange); color: #fff; }
    .pm-prev { left: 14px; } .pm-next { right: 14px; }
    .pm-dots {
      position: absolute; left: 0; right: 0; bottom: 14px; z-index: 5;
      display: flex; justify-content: center; gap: 8px;
    }
    .pm-dots button {
      width: 9px; height: 9px; padding: 0; border: none; border-radius: 50%;
      background: rgba(255,255,255,.55); cursor: pointer; transition: .3s;
    }
    .pm-dots button.on { background: var(--orange); width: 26px; border-radius: 6px; }
    .pm-body { padding: 30px 34px 34px; }
    .pm-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 52px; height: 52px; border-radius: 14px;
      background: var(--orange-light); color: var(--orange); font-size: 1.4rem;
      margin-bottom: 12px;
    }
    .pm-title { font-size: 1.9rem; font-weight: 800; line-height: 1.2; color: var(--dark); }
    .pm-sub { color: var(--orange); font-weight: 600; margin: 4px 0 18px; }
    .pm-article p { color: #444; margin-bottom: 14px; font-size: .98rem; }
    .pm-article blockquote {
      border-left: 4px solid var(--orange); background: var(--orange-light);
      padding: 14px 18px; border-radius: 0 12px 12px 0;
      font-style: italic; color: #5a3410; margin: 18px 0;
    }
    .pm-numbers {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      margin: 24px 0;
    }
    .pm-num {
      background: var(--light); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px 10px; text-align: center;
    }
    .pm-num strong { display: block; font-size: 2rem; font-weight: 800; color: var(--orange); line-height: 1.1; }
    .pm-num span { font-size: .8rem; color: var(--gray); }
    .pm-donate { text-align: center; margin-top: 8px; }
    .pm-donate .btn { width: 100%; max-width: 420px; }
    .pm-donate small { display: block; margin-top: 10px; color: #888; }
    @media (max-width: 600px) {
      .pm-slider { height: 230px; }
      .pm-body { padding: 22px 20px 26px; }
      .pm-title { font-size: 1.5rem; }
      .pm-numbers { grid-template-columns: 1fr; }
      .pm-num { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; text-align: left; }
      .pm-num strong { font-size: 1.5rem; }
    }
    /* ================= PHOTO STRIP ================= */
    .photo-strip {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 15px;
      margin-top: 35px;
    }
    .photo-strip img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 17px;
      transition: .4s;
    }
    .photo-strip img:hover {
      transform: scale(1.025);
    }
    /* ================= CARDS ================= */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      gap: 22px;
    }
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      transition: .3s;
      box-shadow: 0 5px 20px rgba(0,0,0,.04);
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-7px);
      box-shadow: 0 15px 35px rgba(0,0,0,.1);
    }
    .card i {
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--orange-light);
      color: var(--orange);
      border-radius: 14px;
      font-size: 1.5rem;
      margin-bottom: 17px;
    }
    .card h3 {
      margin-bottom: 8px;
    }
    .card p {
      color: var(--gray);
      font-size: .92rem;
    }
    .card-link-text {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--orange);
    }
    /* ================= CAMPAIGN ================= */
    .campaign-box {
      background: linear-gradient(135deg,#fff4eb,#fff);
      border: 1px solid #ffe0cc;
      border-radius: 25px;
      padding: 35px;
      margin-top: 40px;
    }
    .campaign-title {
      text-align: center;
      color: var(--orange);
      font-size: 2.8rem;
      font-weight: 800;
    }
    .campaign-subtitle {
      text-align: center;
      color: var(--gray);
      margin-bottom: 30px;
    }
    .campaign-main-photo {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
    }
    .progress-card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
      margin-top: 30px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .progress {
      height: 20px;
      background: #e9edf1;
      border-radius: 20px;
      overflow: hidden;
    }
    .progress span {
      display: block;
      width: 4.8%;
      height: 100%;
      background: linear-gradient(90deg,var(--orange),#ff9b52);
      border-radius: 20px;
      animation: progressGrow 1.5s ease;
    }
    @keyframes progressGrow {
      from { width: 0; }
      to { width: 4.8%; }
    }
    .amounts {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0;
    }

      margin-bottom: 18px;
      overflow: hidden;

      position: relative;
      cursor: pointer;

      width: 100%;
      display: block;

      transform: scale(1.05);

      position: absolute;
