<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin Dashboard - Rock ChildCare Ministries</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff6b00;--od:#df5700;--ol:#fff4eb;--d:#171717;--g:#666;--b:#e8e8e8;--l:#f8fafc;--green:#159447;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:var(--l);color:var(--d);line-height:1.5}
button{font-family:inherit}
.top{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.08);padding:12px 4%;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:50}
.top h1{font-size:1.05rem;font-weight:800}.top h1 span{color:var(--o)}
.top .r{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:50px;padding:10px 18px;font-weight:700;font-size:.85rem;cursor:pointer;background:var(--o);color:#fff;text-decoration:none;display:inline-block}
.btn:hover{background:var(--od)}.btn.ghost{background:#fff;color:var(--o);border:2px solid var(--o)}
.btn.sm{padding:7px 12px;font-size:.76rem}.btn.red{background:var(--red)}.btn.gray{background:#e9e9e9;color:#333}.btn.green{background:var(--green)}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 4% 0;background:var(--l)}
.tab{border:0;background:#fff;border-radius:50px;padding:10px 18px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap;color:#444;border:1px solid var(--b)}
.tab.on{background:var(--o);color:#fff;border-color:var(--o)}
.tab i{font-style:normal;background:var(--red);color:#fff;border-radius:50px;padding:1px 8px;font-size:.72rem;margin-left:6px}
main{max-width:1000px;margin:0 auto;padding:22px 4% 80px}
.card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
h2{font-size:1.4rem;color:var(--o);margin-bottom:4px}.lead{color:var(--g);font-size:.92rem;margin-bottom:16px}
label{display:block;font-weight:600;font-size:.85rem;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--b);border-radius:10px;font-size:.95rem;background:var(--l)}
input:focus,select:focus{outline:0;border-color:var(--o);background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.item img.th{width:100%;height:170px;object-fit:cover;border-radius:12px;background:#eee;margin-bottom:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair img{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#eee}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:50px;padding:3px 10px;background:var(--ol);color:var(--o)}
.tag.done{background:#e6f6ec;color:var(--green)}
.msg h3{font-size:1rem}.msg dl{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;margin:10px 0;font-size:.9rem}
.msg dt{color:var(--g);font-weight:600}.msg dd{word-break:break-word}
.msg a{color:var(--o);font-weight:600}
.meter{height:16px;background:#e9edf1;border-radius:20px;overflow:hidden;margin:10px 0}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--o),#ff9b52);border-radius:20px}
.login{max-width:400px;margin:12vh auto;padding:0 4%}
.err{color:var(--red);font-size:.88rem;margin-top:8px}
.note{background:var(--ol);border-left:4px solid var(--o);padding:12px 14px;border-radius:0 10px 10px 0;font-size:.9rem;margin-bottom:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#171717;color:#fff;padding:12px 22px;border-radius:50px;font-size:.9rem;z-index:99;box-shadow:0 8px 26px rgba(0,0,0,.3)}
ol.help{margin-left:20px}ol.help li{margin-bottom:8px}
.hide{display:none!important}
@media(max-width:560px){.msg dl{grid-template-columns:1fr}.top h1{font-size:.9rem}}
</style>
</head>
<body>

<div id="noSetup" class="login hide">
  <div class="card"><h2>Almost there</h2>
    <p class="lead">The website is not connected to its database yet. Open <b>SETUP.md</b> and follow steps 1 to 3, then reload this page.</p></div>
</div>

<div id="loginView" class="login hide">
  <div class="card">
    <h2>Admin sign in</h2>
    <p class="lead">Rock ChildCare Ministries dashboard</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="lerr"></p>
    <div class="row"><button class="btn" id="goLogin">Sign in</button></div>
  </div>
</div>

<div id="appView" class="hide">
  <div class="top">
    <h1>Rock ChildCare <span>Admin</span></h1>
    <div class="r">
      <a class="btn ghost sm" href="index.html" target="_blank">View website</a>
      <button class="btn gray sm" id="logout">Sign out</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="messages">Sign-ups &amp; messages<i id="newCount" class="hide">0</i></button>
    <button class="tab" data-t="posts">Posts</button>
    <button class="tab" data-t="look">Appearance</button>
    <button class="tab" data-t="words">Words &amp; pictures</button>
    <button class="tab" data-t="campaign">Campaign</button>
    <button class="tab" data-t="children">Children</button>
    <button class="tab" data-t="gallery">Gallery</button>
    <button class="tab" data-t="ba">Before &amp; After</button>
    <button class="tab" data-t="help">Help</button>
  </div>
  <main id="main"></main>
</div>

<div id="toast" class="toast hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.CMS_ADMIN = true;</script>
<script src="config.js"></script>
<script src="cms.js"></script>
<script src="cms-defaults.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var e = $('#toast'); e.textContent = t; e.classList.remove('hide'); clearTimeout(toast._t); toast._t = setTimeout(function () { e.classList.add('hide'); }, 2800); }

  if (!CMS.enabled) { $('#noSetup').classList.remove('hide'); return; }
  var sb = CMS.sb, tab = 'messages';

  /* ---------- sign in ---------- */
  function show(authed) { $('#loginView').classList.toggle('hide', authed); $('#appView').classList.toggle('hide', !authed); if (authed) { refreshBadge(); render(); } }
  sb.auth.getSession().then(function (r) { show(!!(r.data && r.data.session)); });
  $('#goLogin').onclick = function () {
    $('#goLogin').textContent = 'Signing in...';
    sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value }).then(function (r) {
      $('#goLogin').textContent = 'Sign in';
      if (r.error) { $('#lerr').textContent = 'Wrong email or password.'; return; }
      show(true);
    });
  };
  $('#pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#goLogin').click(); });
  $('#logout').onclick = function () { sb.auth.signOut().then(function () { show(false); }); };
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('on'); });
    b.classList.add('on'); tab = b.dataset.t; render();
  });

  function refreshBadge() {
    sb.from('submissions').select('id', { count: 'exact', head: true }).eq('status', 'new').then(function (r) {
      var i = $('#newCount'); i.textContent = r.count || 0; i.classList.toggle('hide', !r.count);
    });
  }
  function fail(r) { if (r && r.error) { alert('Something went wrong: ' + r.error.message); return true; } return false; }
  function render() {
    var main = $('#main');
    ({ messages: viewMessages, posts: viewPosts, look: viewAppearance, words: viewWords, campaign: viewCampaign, children: viewChildren, gallery: viewGallery, ba: viewBA, help: viewHelp })[tab](main);
  }
  function pick(multiple) {
    return new Promise(function (res) {
      var i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = !!multiple;
      i.onchange = function () { res(Array.prototype.slice.call(i.files)); }; i.click();
    });
  }
  function upAll(files) { toast('Uploading ' + files.length + ' picture(s)...'); return Promise.all(files.map(CMS.upload)); }
  function reorder(table, list, i, dir) {
    var j = i + dir; if (j < 0 || j >= list.length) return Promise.resolve();
    var t = list[i]; list[i] = list[j]; list[j] = t;
    return Promise.all(list.map(function (row, k) { return sb.from(table).update({ position: k }).eq('id', row.id); }));
  }

  /* ---------- Sign-ups & messages ---------- */
  var LABEL = { role: 'Joining as', location: 'Location', facebook: 'Facebook', whatsapp: 'WhatsApp', email: 'Email', phone: 'Phone / WhatsApp', instagram: 'Instagram', tiktok: 'TikTok', child: 'Asking about child', category: 'Giving toward', amount: 'Amount (USD)' };
  var KIND = { partner: 'Partner / donor / friend sign-up', child: 'Wants to support a child', donation: 'Donation pledge' };
  function viewMessages(main) {
    main.innerHTML = '<h2>Sign-ups &amp; messages</h2><p class="lead">Everyone who joins as a partner, asks about a child, or starts a donation appears here.</p>' +
      '<div class="row" style="margin:0 0 14px"><select id="flt" style="max-width:220px"><option value="">Everything</option><option value="new">New only</option><option value="partner">Partners</option><option value="child">Child requests</option><option value="donation">Donation pledges</option></select>' +
      '<button class="btn ghost sm" id="csv">Download list (Excel)</button></div><div id="list">Loading...</div>';
    var rows = [];
    function draw() {
      var f = $('#flt').value, out = rows.filter(function (r) { return !f || r.status === f || r.kind === f; });
      $('#list').innerHTML = out.length ? out.map(function (r) {
        var d = r.data || {}, dl = Object.keys(d).filter(function (k) { return d[k]; }).map(function (k) {
          var v = esc(d[k]);
          if (k === 'email') v = '<a href="mailto:' + v + '">' + v + '</a>';
          if (k === 'phone' || k === 'whatsapp') { var n = String(d[k]).replace(/[^\d]/g, ''); if (n.length > 6) v = '<a target="_blank" href="https://wa.me/' + n + '">' + v + '</a>'; }
          return '<dt>' + esc(LABEL[k] || k) + '</dt><dd>' + v + '</dd>';
        }).join('');
        return '<div class="card msg"><div class="row" style="margin:0;justify-content:space-between"><span class="tag ' + (r.status === 'done' ? 'done' : '') + '">' + (r.status === 'done' ? 'Done' : 'New') + '</span><small>' + new Date(r.created_at).toLocaleString() + '</small></div>' +
          '<h3 style="margin-top:8px">' + esc(r.name || 'Anonymous') + '</h3><small style="color:#666">' + esc(KIND[r.kind] || r.kind) + '</small><dl>' + dl + '</dl>' +
          '<div class="row" style="margin:0"><button class="btn sm green" data-a="done" data-id="' + r.id + '">' + (r.status === 'done' ? 'Mark as new' : 'Mark as done') + '</button><button class="btn sm red" data-a="del" data-id="' + r.id + '">Delete</button></div></div>';
      }).join('') : '<div class="card">Nothing here yet.</div>';
    }
    function load() { sb.from('submissions').select('*').order('created_at', { ascending: false }).then(function (r) { if (fail(r)) return; rows = r.data; draw(); }); }
    $('#flt').onchange = draw;
    $('#list').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var row = rows.filter(function (x) { return x.id === b.dataset.id; })[0];
      if (b.dataset.a === 'done') sb.from('submissions').update({ status: row.status === 'done' ? 'new' : 'done' }).eq('id', row.id).then(function () { load(); refreshBadge(); });
      if (b.dataset.a === 'del' && confirm('Delete this entry for good?')) sb.from('submissions').delete().eq('id', row.id).then(function () { load(); refreshBadge(); });
    };
    $('#csv').onclick = function () {
      var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
      var csv = '\ufeffDate,Type,Name,Status,Details\n' + rows.map(function (r) {
        var det = Object.keys(r.data || {}).map(function (k) { return (LABEL[k] || k) + ': ' + r.data[k]; }).join(' | ');
        return [new Date(r.created_at).toLocaleString(), KIND[r.kind] || r.kind, r.name, r.status, det].map(q).join(',');
      }).join('\n');
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'signups.csv'; a.click();
    };
    load();
  }

  /* ---------- Posts (like Facebook) ---------- */
  function viewPosts(main) {
    main.innerHTML = '<h2>Posts</h2><p class="lead">Write updates just like on Facebook. The newest three show on the Home page, right under the big banner. All of them show on the <b>Updates</b> page. A pinned post always comes first.</p>' +
      '<div class="card"><textarea id="pb" rows="4" placeholder="What is happening at Rock ChildCare Ministries?"></textarea><div id="pv" class="row" style="margin-top:8px"></div>' +
      '<div class="row"><button class="btn ghost sm" id="pph">&#128247; Add photos</button><label style="margin:0;display:flex;gap:6px;align-items:center;font-weight:600"><input type="checkbox" id="ppin" style="width:auto"> Pin to top</label><button class="btn" id="ppost" style="margin-left:auto">Post</button></div></div><div id="plist">Loading...</div>';
    var rows = [], files = [], editing = null;
    function previews() {
      $('#pv').innerHTML = files.map(function (f, i) { return '<div style="position:relative"><img src="' + URL.createObjectURL(f) + '" style="width:84px;height:84px;object-fit:cover;border-radius:10px"><button class="btn red sm" data-rm="' + i + '" style="position:absolute;top:2px;right:2px;padding:2px 8px">x</button></div>'; }).join('');
    }
    $('#pph').onclick = function () { pick(true).then(function (f) { files = files.concat(f); previews(); }); };
    $('#pv').onclick = function (e) { var b = e.target.closest('[data-rm]'); if (b) { files.splice(+b.dataset.rm, 1); previews(); } };
    $('#ppost').onclick = function () {
      var body = $('#pb').value.trim(); if (!body && !files.length) { alert('Write something or add a photo first.'); return; }
      var btn = this; btn.disabled = true; btn.textContent = 'Posting...';
      (files.length ? upAll(files) : Promise.resolve([])).then(function (urls) {
        return sb.from('posts').insert({ body: body, images: urls, pinned: $('#ppin').checked });
      }).then(function (r) {
        btn.disabled = false; btn.textContent = 'Post'; if (fail(r)) return;
        $('#pb').value = ''; $('#ppin').checked = false; files = []; previews(); load(); toast('Posted \u2713');
      }).catch(function (e) { btn.disabled = false; btn.textContent = 'Post'; alert(e.message); });
    };
    function draw() {
      $('#plist').innerHTML = rows.length ? rows.map(function (p) {
        var imgs = (p.images || []).map(function (u) { return '<img src="' + esc(u) + '" style="width:90px;height:90px;object-fit:cover;border-radius:10px">'; }).join('');
        return '<div class="card" data-id="' + p.id + '"><div class="row" style="margin:0;justify-content:space-between"><span class="tag">' + (p.pinned ? '&#128204; Pinned' : 'Post') + '</span><small>' + new Date(p.created_at).toLocaleString() + ' &middot; &#10084;&#65039; ' + (p.likes || 0) + '</small></div>' +
          (editing === p.id ? '<textarea class="eb" rows="4" style="margin-top:10px">' + esc(p.body) + '</textarea>' : '<p style="white-space:pre-wrap;margin:10px 0">' + esc(p.body) + '</p>') +
          (imgs ? '<div class="row" style="margin:0 0 6px">' + imgs + '</div>' : '') +
          '<div class="row" style="margin:6px 0 0">' + (editing === p.id ? '<button class="btn sm" data-a="save">Save</button><button class="btn sm gray" data-a="cancel">Cancel</button>' :
            '<button class="btn sm ghost" data-a="edit">Edit</button><button class="btn sm gray" data-a="pin">' + (p.pinned ? 'Unpin' : 'Pin to top') + '</button><button class="btn sm red" data-a="del">Delete</button>') + '</div></div>';
      }).join('') : '<div class="card">No posts yet. Write your first one above.</div>';
    }
    function load() {
      sb.from('posts').select('*').order('pinned', { ascending: false }).order('created_at', { ascending: false }).then(function (r) {
        if (r.error) { $('#plist').innerHTML = '<div class="card"><b>One more setup step.</b><br>Run <b>setup-posts.sql</b> in Supabase (SQL Editor), then reload this page.</div>'; return; }
        rows = r.data; draw();
      });
    }
    $('#plist').onclick = function (e) {
      var b = e.target.closest('button'); if (!b || !b.dataset.a) return;
      var id = b.closest('.card').dataset.id, p = rows.filter(function (x) { return x.id === id; })[0];
      if (b.dataset.a === 'edit') { editing = id; draw(); }
      if (b.dataset.a === 'cancel') { editing = null; draw(); }
      if (b.dataset.a === 'save') sb.from('posts').update({ body: b.closest('.card').querySelector('.eb').value.trim() }).eq('id', id).then(function (r) { if (!fail(r)) { editing = null; load(); toast('Saved \u2713'); } });
      if (b.dataset.a === 'pin') sb.from('posts').update({ pinned: !p.pinned }).eq('id', id).then(function () { load(); });
      if (b.dataset.a === 'del' && confirm('Delete this post for good?')) sb.from('posts').delete().eq('id', id).then(function () { load(); });
    };
    load();
  }

  /* ---------- Appearance: colours, font, sections, menu ---------- */
  var PAGES = { home: 'Home', about: 'About', campaign: 'Campaign', updates: 'Updates (shows once you have posts)', gallery: 'Gallery', contact: 'Contact' };
  var BLOCKS = { hero: 'Big top banner with slideshow', stats: 'Numbers strip (children reached, programs)', strip: 'The three pictures under the banner (your latest Posts)', whatwedo: '"What We Do" cards', banner: '"Give Hope Today" donate banner' };
  var SWATCH = { Orange: '#ff6b00', Blue: '#1e6fd9', Green: '#159447', Purple: '#7b3fe4', Red: '#d92d3a', Teal: '#0f9d9a', Pink: '#d6336c' };
  function viewAppearance(main) {
    main.innerHTML = '<h2>Appearance</h2><p class="lead">Change the colour, the lettering, which sections show, and the order of the menu.</p><div id="lk">Loading...</div>';
    sb.from('kv').select('key,value').in('key', ['theme', 'layout']).then(function (r) {
      var kv = {}; (r.data || []).forEach(function (x) { kv[x.key] = x.value; });
      var th = Object.assign({ primary: '#ff6b00', font: 'Poppins' }, kv.theme || {});
      var ly = Object.assign({ hiddenPages: [], hiddenBlocks: [], navOrder: [] }, kv.layout || {});
      var order = (ly.navOrder || []).filter(function (id) { return PAGES[id]; });
      Object.keys(PAGES).forEach(function (id) { if (order.indexOf(id) < 0) order.push(id); });
      function draw() {
        $('#lk').innerHTML =
          '<div class="card"><h3 style="margin-bottom:8px">Main colour</h3><div class="row" style="margin:0">' +
          Object.keys(SWATCH).map(function (n) { return '<button data-c="' + SWATCH[n] + '" title="' + n + '" style="width:44px;height:44px;border-radius:50%;border:' + (th.primary.toLowerCase() === SWATCH[n] ? '4px solid #171717' : '2px solid #ddd') + ';background:' + SWATCH[n] + ';cursor:pointer"></button>'; }).join('') +
          '<label style="margin:0 0 0 8px">or pick any:</label><input type="color" id="pc" value="' + esc(th.primary) + '" style="width:60px;height:44px;padding:2px"></div>' +
          '<h3 style="margin:18px 0 8px">Lettering</h3><select id="pf" style="max-width:280px">' + Object.keys(CMS.FONTS).map(function (f) { return '<option' + (f === th.font ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select>' +
          '<div style="margin-top:14px;padding:16px;border-radius:12px;background:' + esc(th.primary) + '14;border:1px solid ' + esc(th.primary) + '55;font-family:\'' + esc(th.font) + '\',sans-serif"><b style="color:' + esc(th.primary) + '">Preview: Hope Begins With One Helping Hand</b><br><span class="btn" style="background:' + esc(th.primary) + ';margin-top:8px">Donate</span></div></div>' +
          '<div class="card"><h3 style="margin-bottom:4px">Menu pages</h3><p class="lead" style="margin-bottom:8px">Untick to hide a page from the website. Arrows change the menu order.</p>' +
          order.map(function (id, i) { return '<div class="row" style="margin:4px 0;padding:8px 0;border-bottom:1px solid #eee"><label style="margin:0;display:flex;gap:8px;align-items:center;flex:1;font-weight:600"><input type="checkbox" style="width:auto" data-pg="' + id + '"' + (ly.hiddenPages.indexOf(id) < 0 ? ' checked' : '') + (id === 'home' ? ' disabled' : '') + '> ' + PAGES[id] + '</label><button class="btn sm gray" data-mv="' + i + '|-1">&uarr;</button><button class="btn sm gray" data-mv="' + i + '|1">&darr;</button></div>'; }).join('') +
          '<div class="row" style="margin:4px 0"><label style="margin:0;display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" style="width:auto" data-pg="impact"' + (ly.hiddenPages.indexOf('impact') < 0 ? ' checked' : '') + '> Our Impact (floating button and page)</label></div></div>' +
          '<div class="card"><h3 style="margin-bottom:4px">Home page sections</h3><p class="lead" style="margin-bottom:8px">Untick to hide a section on the Home page.</p>' +
          Object.keys(BLOCKS).map(function (b) { return '<div class="row" style="margin:4px 0"><label style="margin:0;display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" style="width:auto" data-bl="' + b + '"' + (ly.hiddenBlocks.indexOf(b) < 0 ? ' checked' : '') + '> ' + BLOCKS[b] + '</label></div>'; }).join('') + '</div>' +
          '<div class="row"><button class="btn" id="lsv">Save appearance</button><button class="btn gray" id="lrs">Back to original look</button></div>';
      }
      function collect() {
        th.font = $('#pf').value; th.primary = $('#pc').value;
        ly.hiddenPages = Array.prototype.filter.call(document.querySelectorAll('[data-pg]'), function (c) { return !c.checked; }).map(function (c) { return c.dataset.pg; });
        ly.hiddenBlocks = Array.prototype.filter.call(document.querySelectorAll('[data-bl]'), function (c) { return !c.checked; }).map(function (c) { return c.dataset.bl; });
      }
      draw();
      var box = $('#lk');
      box.onchange = function (e) { if (e.target.id === 'pf' || e.target.id === 'pc') { collect(); draw(); } };
      box.onclick = function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.dataset.c) { collect(); th.primary = b.dataset.c; draw(); }
        if (b.dataset.mv) { collect(); var a = b.dataset.mv.split('|'), i = +a[0], j = i + +a[1]; if (j >= 0 && j < order.length) { var t = order[i]; order[i] = order[j]; order[j] = t; } draw(); }
        if (b.id === 'lsv') { collect(); ly.navOrder = order; var now = new Date().toISOString();
          sb.from('kv').upsert([{ key: 'theme', value: th, updated_at: now }, { key: 'layout', value: ly, updated_at: now }]).then(function (x) { if (!fail(x)) toast('Saved \u2713 Open the website to see it'); }); }
        if (b.id === 'lrs' && confirm('Put the colour, lettering, menu and sections back to how they were?')) {
          var n = new Date().toISOString(); sb.from('kv').upsert([{ key: 'theme', value: {}, updated_at: n }, { key: 'layout', value: {}, updated_at: n }]).then(function (x) { if (!fail(x)) { toast('Back to original \u2713'); viewAppearance(main); } }); }
      };
    });
  }

  /* ---------- Words & pictures ---------- */
  function viewWords(main) {
    main.innerHTML = '<h2>Words &amp; pictures</h2><p class="lead">Change any wording or picture on the website, just by tapping it.</p>' +
      '<div class="card"><ol class="help"><li>Press the big button below. Your website opens in edit mode.</li><li><b>Tap any words</b> to rewrite them, or <b>tap a picture</b> to swap it.</li><li>Use the page menu at the bottom to move between pages.</li><li>Press <b>Publish changes</b> when you are happy. Visitors see it straight away.</li></ol>' +
      '<div class="row"><a class="btn" href="index.html?edit=1" target="_blank">Open website in edit mode</a></div></div>' +
      '<div class="note">Children, Gallery, Before &amp; After and the campaign amounts are managed in their own tabs here.</div>';
  }

  /* ---------- Campaign ---------- */
  function viewCampaign(main) {
    main.innerHTML = '<h2>Campaign</h2><p class="lead">Update the money raised and the goal. The progress bar updates itself.</p><div class="card" id="cmp">Loading...</div>';
    sb.from('kv').select('value').eq('key', 'campaign').then(function (r) {
      var c = (r.data && r.data[0] && r.data[0].value) || { raised: 2400, goal: 50000 };
      $('#cmp').innerHTML = '<label>Raised so far (USD)</label><input id="rs" type="number" min="0" value="' + esc(c.raised) + '"><label>Campaign goal (USD)</label><input id="gl" type="number" min="1" value="' + esc(c.goal) + '">' +
        '<div class="meter"><span id="mt"></span></div><p id="pc" class="lead"></p><div class="row"><button class="btn" id="sv">Save campaign</button></div>' +
        '<div class="note" style="margin-top:16px">To change the campaign title or story words, use <b>Words &amp; pictures</b> and tap them.</div>';
      function prev() { var a = +$('#rs').value || 0, g = +$('#gl').value || 1, p = Math.min(100, Math.round(a / g * 1000) / 10); $('#mt').style.width = p + '%'; $('#pc').textContent = p + '% of the goal reached'; }
      $('#rs').oninput = $('#gl').oninput = prev; prev();
      $('#sv').onclick = function () {
        sb.from('kv').upsert({ key: 'campaign', value: { raised: +$('#rs').value || 0, goal: +$('#gl').value || 1 }, updated_at: new Date().toISOString() }).then(function (x) { if (!fail(x)) toast('Campaign saved \u2713'); });
      };
    });
  }

  /* ---------- Children ---------- */
  function viewChildren(main) {
    main.innerHTML = '<h2>Children</h2><p class="lead">These are the children shown on the Our Impact page ("Support Children Like Haniffah").</p><div class="row" style="margin:0 0 14px"><button class="btn" id="add">+ Add a child</button></div><div id="list" class="grid">Loading...</div>';
    var rows = [];
    function draw() {
      if (!rows.length) { $('#list').innerHTML = '<div class="card" style="grid-column:1/-1">No children saved yet. The website is showing its built-in list.<div class="row"><button class="btn" id="imp">Import the current children so I can edit them</button></div></div>'; $('#imp').onclick = function () { sb.from('children').insert(CMS_DEFAULTS.children.map(function (c, i) { return { name: c.name, sub: c.sub, img: c.img, position: i }; })).then(function (r) { if (!fail(r)) load(); }); }; return; }
      $('#list').innerHTML = rows.map(function (c, i) {
        return '<div class="card item" data-id="' + c.id + '"><img class="th" src="' + esc(c.img) + '"><label>Name</label><input class="n" value="' + esc(c.name) + '"><label>Short note (optional)</label><input class="s" value="' + esc(c.sub) + '">' +
          '<div class="row"><button class="btn sm" data-a="save">Save</button><button class="btn sm ghost" data-a="photo">Change photo</button><button class="btn sm gray" data-a="up">&uarr;</button><button class="btn sm gray" data-a="down">&darr;</button><button class="btn sm red" data-a="del">Delete</button></div></div>';
      }).join('');
    }
    function load() { sb.from('children').select('*').order('position').then(function (r) { if (fail(r)) return; rows = r.data; draw(); }); }
    $('#add').onclick = function () {
      var name = prompt('Child\'s first name:'); if (!name) return;
      pick(false).then(function (f) { if (!f.length) return; return upAll(f).then(function (u) { return sb.from('children').insert({ name: name, sub: '', img: u[0], position: rows.length }); }); }).then(function (r) { if (r && fail(r)) return; load(); toast('Child added \u2713'); }).catch(function (e) { alert(e.message); });
    };
    $('#list').onclick = function (e) {
      var b = e.target.closest('button'); if (!b || !b.dataset.a) return;
      var card = b.closest('.item'), i = rows.findIndex(function (x) { return x.id === card.dataset.id; }), c = rows[i];
      if (b.dataset.a === 'save') sb.from('children').update({ name: card.querySelector('.n').value.trim() || c.name, sub: card.querySelector('.s').value.trim() }).eq('id', c.id).then(function (r) { if (!fail(r)) toast('Saved \u2713'); });
      if (b.dataset.a === 'photo') pick(false).then(function (f) { if (!f.length) return; return upAll(f).then(function (u) { return sb.from('children').update({ img: u[0] }).eq('id', c.id); }); }).then(function (r) { if (r && fail(r)) return; load(); toast('Photo changed \u2713'); }).catch(function (er) { alert(er.message); });
      if (b.dataset.a === 'up') reorder('children', rows, i, -1).then(load);
      if (b.dataset.a === 'down') reorder('children', rows, i, 1).then(load);
      if (b.dataset.a === 'del' && confirm('Remove ' + c.name + ' from the website?')) sb.from('children').delete().eq('id', c.id).then(load);
    };
    load();
  }

  /* ---------- Gallery ---------- */
  function viewGallery(main) {
    main.innerHTML = '<h2>Gallery</h2><p class="lead">The pictures in the Gallery page slideshow and heart. Add many at once.</p><div class="row" style="margin:0 0 14px"><button class="btn" id="add">+ Add pictures</button></div><div id="list" class="grid">Loading...</div>';
    var rows = [];
    function draw() {
      if (!rows.length) { $('#list').innerHTML = '<div class="card" style="grid-column:1/-1">No pictures saved yet. The website is showing its built-in gallery.<div class="row"><button class="btn" id="imp">Import the current gallery so I can edit it</button></div></div>'; $('#imp').onclick = function () { sb.from('gallery').insert(CMS_DEFAULTS.gallery.map(function (g, i) { return { src: g.src, caption: g.caption, position: i }; })).then(function (r) { if (!fail(r)) load(); }); }; return; }
      $('#list').innerHTML = rows.map(function (g) {
        return '<div class="card item" data-id="' + g.id + '"><img class="th" src="' + esc(g.src) + '"><label>Caption</label><input class="c" value="' + esc(g.caption) + '"><div class="row"><button class="btn sm" data-a="save">Save</button><button class="btn sm gray" data-a="up">&uarr;</button><button class="btn sm gray" data-a="down">&darr;</button><button class="btn sm red" data-a="del">Delete</button></div></div>';
      }).join('');
    }
    function load() { sb.from('gallery').select('*').order('position').then(function (r) { if (fail(r)) return; rows = r.data; draw(); }); }
    $('#add').onclick = function () {
      pick(true).then(function (f) { if (!f.length) return; return upAll(f).then(function (urls) { return sb.from('gallery').insert(urls.map(function (u, k) { return { src: u, caption: 'Our moments of hope', position: rows.length + k }; })); }); }).then(function (r) { if (r && fail(r)) return; load(); toast('Pictures added \u2713'); }).catch(function (e) { alert(e.message); });
    };
    $('#list').onclick = function (e) {
      var b = e.target.closest('button'); if (!b || !b.dataset.a) return;
      var card = b.closest('.item'), i = rows.findIndex(function (x) { return x.id === card.dataset.id; }), g = rows[i];
      if (b.dataset.a === 'save') sb.from('gallery').update({ caption: card.querySelector('.c').value.trim() }).eq('id', g.id).then(function (r) { if (!fail(r)) toast('Saved \u2713'); });
      if (b.dataset.a === 'up') reorder('gallery', rows, i, -1).then(load);
      if (b.dataset.a === 'down') reorder('gallery', rows, i, 1).then(load);
      if (b.dataset.a === 'del' && confirm('Remove this picture from the website?')) sb.from('gallery').delete().eq('id', g.id).then(load);
    };
    load();
  }

  /* ---------- Before & After ---------- */
  function viewBA(main) {
    main.innerHTML = '<h2>Before &amp; After</h2><p class="lead">The moving strip on the Our Impact page. Each story is one Before picture and one After picture.</p><div class="row" style="margin:0 0 14px"><button class="btn" id="add">+ Add a story</button></div><div id="list">Loading...</div>';
    var rows = [];
    function draw() {
      if (!rows.length) { $('#list').innerHTML = '<div class="card">No stories saved yet. The website is showing its built-in ones.<div class="row"><button class="btn" id="imp">Import the current stories so I can edit them</button></div></div>'; $('#imp').onclick = function () { sb.from('before_after').insert(CMS_DEFAULTS.beforeAfter.map(function (b, i) { b.position = i; return b; })).then(function (r) { if (!fail(r)) load(); }); }; return; }
      $('#list').innerHTML = rows.map(function (b) {
        return '<div class="card item" data-id="' + b.id + '"><div class="pair"><div><img src="' + esc(b.before_src) + '"><label>Before caption</label><input class="bc" value="' + esc(b.before_caption) + '"><div class="row"><button class="btn sm ghost" data-a="pb">Change Before photo</button></div></div>' +
          '<div><img src="' + esc(b.after_src) + '"><label>After caption</label><input class="ac" value="' + esc(b.after_caption) + '"><div class="row"><button class="btn sm ghost" data-a="pa">Change After photo</button></div></div></div>' +
          '<div class="row"><button class="btn sm" data-a="save">Save captions</button><button class="btn sm gray" data-a="up">&uarr;</button><button class="btn sm gray" data-a="down">&darr;</button><button class="btn sm red" data-a="del">Delete</button></div></div>';
      }).join('');
    }
    function load() { sb.from('before_after').select('*').order('position').then(function (r) { if (fail(r)) return; rows = r.data; draw(); }); }
    $('#add').onclick = function () {
      alert('First choose the BEFORE picture, then the AFTER picture.');
      var urls = [];
      pick(false).then(function (f) { if (!f.length) throw new Error('cancel'); return upAll(f); }).then(function (u) { urls.push(u[0]); alert('Now choose the AFTER picture.'); return pick(false); })
        .then(function (f) { if (!f.length) throw new Error('cancel'); return upAll(f); }).then(function (u) {
          return sb.from('before_after').insert({ before_src: urls[0], after_src: u[0], before_caption: 'Where the story began.', after_caption: 'Hope made the difference.', position: rows.length });
        }).then(function (r) { if (fail(r)) return; load(); toast('Story added \u2713'); }).catch(function (e) { if (e.message !== 'cancel') alert(e.message); });
    };
    $('#list').onclick = function (e) {
      var b = e.target.closest('button'); if (!b || !b.dataset.a) return;
      var card = b.closest('.item'), i = rows.findIndex(function (x) { return x.id === card.dataset.id; }), r0 = rows[i];
      function swap(field) { pick(false).then(function (f) { if (!f.length) return; return upAll(f).then(function (u) { var o = {}; o[field] = u[0]; return sb.from('before_after').update(o).eq('id', r0.id); }); }).then(function (r) { if (r && fail(r)) return; load(); toast('Photo changed \u2713'); }).catch(function (er) { alert(er.message); }); }
      if (b.dataset.a === 'pb') swap('before_src');
      if (b.dataset.a === 'pa') swap('after_src');
      if (b.dataset.a === 'save') sb.from('before_after').update({ before_caption: card.querySelector('.bc').value.trim(), after_caption: card.querySelector('.ac').value.trim() }).eq('id', r0.id).then(function (r) { if (!fail(r)) toast('Saved \u2713'); });
      if (b.dataset.a === 'up') reorder('before_after', rows, i, -1).then(load);
      if (b.dataset.a === 'down') reorder('before_after', rows, i, 1).then(load);
      if (b.dataset.a === 'del' && confirm('Remove this story?')) sb.from('before_after').delete().eq('id', r0.id).then(load);
    };
    load();
  }
